<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 - Telepathy Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            bg: '#F8FAFC',
                            card: '#FFFFFF',
                            border: '#E2E8F0',
                            text: '#334155',
                            muted: '#64748B',
                            lightBlue: '#F0F9FF',
                            softBlue: '#BAE6FD',
                            blue: '#38BDF8',
                            accent: '#0284C7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Notion 極簡質感與 3D CSS 翻牌動畫 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F8FAFC;
            color: #334155;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- 主應用容器 -->
    <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
        
        <!-- Header 頁首 -->
        <header class="flex justify-between items-center pb-6 border-b border-notion-border mb-6">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🧠</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-notion-text">雲端心電感應</h1>
                    <p class="text-xs text-notion-muted">多人默契大考驗</p>
                </div>
            </div>
            
            <!-- 房間資訊標籤 -->
            <div id="roomBadge" class="hidden items-center space-x-2 bg-notion-lightBlue border border-notion-softBlue text-notion-accent px-3 py-1.5 rounded-lg text-sm font-medium">
                <span>📍 房號：<strong id="displayRoomCode">---</strong></span>
                <button onclick="leaveRoom()" class="text-xs underline text-notion-muted hover:text-red-500 ml-2">離開</button>
            </div>
        </header>

        <!-- 視圖 1: 登入與房間分流頁面 -->
        <div id="viewLogin" class="flex-1 flex flex-col justify-center items-center">
            <div class="w-full max-w-md bg-white border border-notion-border rounded-xl p-6 shadow-sm">
                <h2 class="text-lg font-semibold text-center mb-6">輸入暱稱與房間代碼</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-notion-muted mb-1">玩家暱稱</label>
                        <input type="text" id="inputPlayerName" placeholder="例如：小明" 
                            class="w-full px-3 py-2 border border-notion-border rounded-lg focus:outline-none focus:ring-2 focus:ring-notion-accent/30 focus:border-notion-accent transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-notion-muted mb-1">房間代碼 (填選房號進行分組)</label>
                        <div class="flex space-x-2">
                            <input type="text" id="inputRoomCode" placeholder="例如：ROOM888" 
                                class="flex-1 px-3 py-2 border border-notion-border rounded-lg focus:outline-none focus:ring-2 focus:ring-notion-accent/30 focus:border-notion-accent transition">
                            <button onclick="generateRandomRoom()" class="px-3 py-2 text-xs bg-slate-100 text-notion-muted hover:bg-slate-200 rounded-lg transition">隨機開房</button>
                        </div>
                    </div>
                    <button onclick="joinRoom()" class="w-full mt-2 bg-notion-accent hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition">
                        進入遊戲房間
                    </button>
                </div>
            </div>
        </div>

        <!-- 視圖 2: 遊戲主介面 -->
        <div id="viewGame" class="hidden flex-1 flex flex-col space-y-6">
            
            <!-- 題目區塊 -->
            <div class="bg-white border border-notion-border rounded-xl p-6 shadow-sm text-center">
                <span class="text-xs uppercase tracking-wider text-notion-muted font-semibold">當前題目</span>
                <h2 id="displayQuestion" class="text-2xl font-bold text-notion-text mt-2">等待房主出題中...</h2>
                <div id="gameStatusBadge" class="inline-block mt-3 px-3 py-1 bg-slate-100 text-notion-muted rounded-full text-xs font-medium">
                    狀態：等待中
                </div>
            </div>

            <!-- 玩家填答區 -->
            <div id="inputAnswerSection" class="bg-white border border-notion-border rounded-xl p-5 shadow-sm">
                <label class="block text-sm font-medium text-notion-text mb-2">請寫下你的心電感應答案：</label>
                <div class="flex space-x-2">
                    <input type="text" id="inputAnswer" placeholder="輸入答案..." 
                        class="flex-1 px-4 py-2 border border-notion-border rounded-lg focus:outline-none focus:ring-2 focus:ring-notion-accent/30">
                    <button onclick="submitAnswer()" class="bg-notion-accent text-white px-6 py-2 rounded-lg font-medium hover:bg-sky-700 transition">
                        送出答案
                    </button>
                </div>
                <p id="submittedHint" class="hidden text-xs text-sky-600 mt-2 font-medium">✓ 答案已成功送出！在開牌前您可隨時重新修改並送出。</p>
            </div>

            <!-- 卡片展示區 -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-semibold text-notion-muted">玩家答案卡片 (<span id="playerCount">0</span>)</h3>
                    <span id="syncIndicator" class="text-xs text-notion-muted flex items-center">
                        <span class="w-2 h-2 rounded-full bg-sky-500 inline-block mr-1.5 animate-pulse"></span>自動同步中
                    </span>
                </div>
                <!-- 3D 卡片網格區 -->
                <div id="cardsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- 動態渲染卡片 -->
                </div>
            </div>

        </div>

    </div>

    <!-- 隱藏房主控制台 (右下角開關) -->
    <div class="fixed bottom-4 right-4 z-50">
        <!-- 控制台低調按鈕 -->
        <button onclick="toggleHostConsole()" title="隱藏房主控制台" 
            class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-notion-accent hover:text-white text-slate-400 transition flex items-center justify-center text-xs border border-notion-border">
            ⚙️
        </button>

        <!-- 房主控制選單面板 -->
        <div id="hostPanel" class="hidden absolute bottom-12 right-0 w-80 bg-white border border-notion-border rounded-xl shadow-xl p-5 text-notion-text">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-notion-border">
                <h3 class="font-bold text-sm flex items-center">👑 隱藏房主控制台</h3>
                <button onclick="toggleHostConsole()" class="text-notion-muted hover:text-black">✕</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-notion-muted mb-1">1. 設定題目 (清空舊答案)</label>
                    <input type="text" id="hostQuestionInput" placeholder="例如：提到冬天會想到什麼？" 
                        class="w-full text-sm px-3 py-1.5 border border-notion-border rounded-lg mb-2 focus:outline-none focus:ring-1 focus:ring-notion-accent">
                    <button onclick="hostSetQuestion()" class="w-full bg-notion-accent text-white text-xs py-2 rounded-lg font-medium hover:bg-sky-700 transition">
                        發布題目並開始遊戲
                    </button>
                </div>

                <hr class="border-notion-border">

                <div>
                    <label class="block text-xs font-medium text-notion-muted mb-1">2. 流程控制</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="hostReveal()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs py-2 rounded-lg font-medium transition">
                            🃏 全員開牌 (3D)
                        </button>
                        <button onclick="hostReset()" class="bg-slate-100 hover:bg-slate-200 text-notion-muted text-xs py-2 rounded-lg font-medium transition">
                            🔄 重置房間
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 常數宣告[cite: 7]
        const SHEET_NAME = 'TelepathyData';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxeZG6_X5QaWEb69LsCSSJde7nURUrVLJkxpWHHvW5aHaaHqGn0fPyPZb8jeVpF1Olt/exec";

        // 全域狀態變數
        let currentRoom = "";
        let playerName = "";
        let pollingTimer = null;
        let lastStatus = "";

        // 隨機產生房號
        function generateRandomRoom() {
            const randomCode = 'ROOM' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('inputRoomCode').value = randomCode;
        }

        // 加入房間[cite: 7]
        function joinRoom() {
            const pName = document.getElementById('inputPlayerName').value.trim();
            const rCode = document.getElementById('inputRoomCode').value.trim().toUpperCase();

            if (!pName || !rCode) {
                alert('請填寫玩家暱稱與房間代碼！');
                return;
            }

            playerName = pName;
            currentRoom = rCode;

            document.getElementById('displayRoomCode').innerText = currentRoom;
            document.getElementById('viewLogin').classList.add('hidden');
            document.getElementById('viewGame').classList.remove('hidden');
            document.getElementById('roomBadge').classList.remove('hidden');
            document.getElementById('roomBadge').classList.add('flex');

            // 啟動 Polling 輪詢機制 (每 2 秒向 GAS 抓取最新狀態)[cite: 7]
            fetchRoomData();
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(fetchRoomData, 2000);
        }

        // 離開房間
        function leaveRoom() {
            if (pollingTimer) clearInterval(pollingTimer);
            currentRoom = "";
            document.getElementById('viewGame').classList.add('hidden');
            document.getElementById('viewLogin').classList.remove('hidden');
            document.getElementById('roomBadge').classList.add('hidden');
            document.getElementById('roomBadge').classList.remove('flex');
        }

        // 從 GAS 獲取房間最新狀態 (GET)[cite: 7]
        async function fetchRoomData() {
            if (!currentRoom) return;

            try {
                const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
                const data = await response.json();
                
                updateGameUI(data);
            } catch (error) {
                console.error("抓取房間資料失敗:", error);
            }
        }

        // 依據狀態更新前端畫面[cite: 7]
        function updateGameUI(data) {
            const qElement = document.getElementById('displayQuestion');
            const statusBadge = document.getElementById('gameStatusBadge');
            const inputSection = document.getElementById('inputAnswerSection');
            
            qElement.innerText = data.question || "等待房主出題中...";
            
            if (data.status === 'setup') {
                statusBadge.innerText = '狀態：等待房主出題';
                statusBadge.className = 'inline-block mt-3 px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-xs font-medium';
                inputSection.classList.add('hidden');
            } else if (data.status === 'playing') {
                statusBadge.innerText = '狀態：玩家回答中...';
                statusBadge.className = 'inline-block mt-3 px-3 py-1 bg-sky-50 text-sky-700 border border-sky-200 rounded-full text-xs font-medium';
                inputSection.classList.remove('hidden');
            } else if (data.status === 'revealed') {
                statusBadge.innerText = '狀態：已開牌！';
                statusBadge.className = 'inline-block mt-3 px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-medium';
                inputSection.classList.add('hidden');
            }

            // 狀態變更為 playing 時，清空舊的輸入與成功提示[cite: 7]
            if (data.status !== lastStatus && data.status === 'playing') {
                document.getElementById('submittedHint').classList.add('hidden');
                document.getElementById('inputAnswer').value = '';
            }
            lastStatus = data.status;

            // 渲染玩家 3D 卡片[cite: 7]
            renderCards(data.answers || {}, data.status === 'revealed');
        }

        // 渲染 3D 翻牌卡片[cite: 7]
        function renderCards(answers, isRevealed) {
            const grid = document.getElementById('cardsGrid');
            const players = Object.keys(answers);
            document.getElementById('playerCount').innerText = players.length;

            if (players.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-notion-muted text-sm">尚無玩家填答</div>`;
                return;
            }

            grid.innerHTML = players.map(player => {
                const answerText = answers[player];
                const isSelf = player === playerName;
                const flippedClass = isRevealed ? 'card-flipped' : '';

                return `
                <div class="h-36 perspective-1000 ${flippedClass}">
                    <div class="card-inner">
                        <!-- 卡片正面 (蓋牌狀態) -->
                        <div class="card-front bg-white border ${isSelf ? 'border-notion-accent shadow-md' : 'border-notion-border'} shadow-sm flex flex-col justify-between p-4">
                            <div class="w-full flex justify-between items-center">
                                <span class="text-xs font-bold ${isSelf ? 'text-notion-accent' : 'text-notion-muted'}">
                                    ${player} ${isSelf ? '(你)' : ''}
                                </span>
                                <span class="w-2 h-2 rounded-full bg-sky-400"></span>
                            </div>
                            <div class="text-notion-muted text-sm font-medium">❓ 已送出答案</div>
                            <div class="text-[10px] text-notion-muted">等待開牌</div>
                        </div>

                        <!-- 卡片背面 (開牌狀態 - 顯示答案) -->
                        <div class="card-back bg-notion-lightBlue border border-notion-softBlue text-notion-text flex flex-col justify-between p-4 shadow-md">
                            <div class="w-full text-left">
                                <span class="text-xs font-bold text-notion-accent">${player} ${isSelf ? '(你)' : ''}</span>
                            </div>
                            <div class="text-lg font-bold text-notion-text break-all px-1">
                                ${answerText}
                            </div>
                            <div class="text-[10px] text-notion-accent font-medium">心電感應答案</div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 玩家送出答案 (POST: submit_answer)[cite: 7]
        async function submitAnswer() {
            const answer = document.getElementById('inputAnswer').value.trim();
            if (!answer) {
                alert('請輸入答案！');
                return;
            }

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        room: currentRoom,
                        action: 'submit_answer',
                        playerName: playerName,
                        answer: answer
                    })
                });

                document.getElementById('submittedHint').classList.remove('hidden');
                fetchRoomData();
            } catch (error) {
                alert('送出失敗，請檢查網路連線。');
            }
        }

        // 切換隱藏房主控制台
        function toggleHostConsole() {
            const panel = document.getElementById('hostPanel');
            panel.classList.toggle('hidden');
        }

        // 房主：設定題目 (POST: set_question)[cite: 7]
        async function hostSetQuestion() {
            const q = document.getElementById('hostQuestionInput').value.trim();
            if (!q) {
                alert('請輸入題目！');
                return;
            }

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        room: currentRoom,
                        action: 'set_question',
                        question: q
                    })
                });

                document.getElementById('hostQuestionInput').value = '';
                fetchRoomData();
            } catch (error) {
                alert('設定題目失敗');
            }
        }

        // 房主：全員開牌 (POST: reveal)[cite: 7]
        async function hostReveal() {
            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        room: currentRoom,
                        action: 'reveal'
                    })
                });
                fetchRoomData();
            } catch (error) {
                alert('開牌失敗');
            }
        }

        // 房主：重置房間 (POST: reset)[cite: 7]
        async function hostReset() {
            if (!confirm('確定要重置這個房間嗎？重置後所有答案與題目都會清空。')) return;

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        room: currentRoom,
                        action: 'reset'
                    })
                });
                fetchRoomData();
            } catch (error) {
                alert('重置失敗');
            }
        }
    </script>
</body>
</html>
