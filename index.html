<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業產生器 - 自定義迷因 (Meme) 產生器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Montserrat & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- html2canvas for downloading meme -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        meme: ['"Montserrat"', '"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .meme-text {
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                0px 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 0.05em;
            word-break: break-all;
            user-select: none;
        }
        /* Custom scrollbar for presets */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-meme min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-face-laugh-squint text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">MemeCraft 迷因產生器</h1>
                    <p class="text-xs text-slate-400">作業三：前端網頁互動開發</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="triggerRandomMeme()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-purple-300 border border-purple-500/30 transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span class="hidden sm:inline">隨機金句</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Panel: Controls & Inputs (7 Columns) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Step 1: Upload Image -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold tracking-wider text-purple-400 uppercase flex items-center space-x-2">
                        <span class="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs">1</span>
                        <span>選擇或上傳迷因底圖</span>
                    </h2>
                    <span class="text-xs text-slate-400">支援 JPG, PNG, WEBP</span>
                </div>

                <!-- Drag & Drop Upload Zone -->
                <label id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer bg-slate-950/50 hover:bg-purple-950/10 transition group">
                    <div class="w-12 h-12 rounded-full bg-slate-800 group-hover:bg-purple-600/20 flex items-center justify-center text-slate-400 group-hover:text-purple-400 mb-2 transition">
                        <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-slate-200 group-hover:text-purple-300">點擊上傳圖片 或 拖曳檔案至此</span>
                    <span class="text-xs text-slate-500 mt-1">完全在本機運作，保障隱私安全</span>
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                </label>

                <!-- Quick Presets -->
                <div class="mt-4">
                    <p class="text-xs font-semibold text-slate-400 mb-2">快速選擇熱門迷因底圖：</p>
                    <div class="flex space-x-3 overflow-x-auto pb-2" id="preset-container">
                        <!-- Preset items injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Step 2: Text Inputs -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur">
                <h2 class="text-sm font-bold tracking-wider text-purple-400 uppercase flex items-center space-x-2 mb-4">
                    <span class="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs">2</span>
                    <span>輸入迷因文字內容</span>
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Top Text -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-300 flex justify-between">
                            <span>上方文字 (Top Text)</span>
                            <span id="top-char-count" class="text-slate-500 text-[10px]">10/50</span>
                        </label>
                        <input type="text" id="top-text-input" maxlength="50" placeholder="例如：當你以為DDL還很久..." 
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                    </div>

                    <!-- Bottom Text -->
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-300 flex justify-between">
                            <span>下方文字 (Bottom Text)</span>
                            <span id="bottom-char-count" class="text-slate-500 text-[10px]">10/50</span>
                        </label>
                        <input type="text" id="bottom-text-input" maxlength="50" placeholder="例如：結果明天就要交作業" 
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                    </div>
                </div>
            </div>

            <!-- Step 3: Style Sliders & Adjustments -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold tracking-wider text-purple-400 uppercase flex items-center space-x-2">
                        <span class="w-6 h-6 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs">3</span>
                        <span>樣式與進階微調</span>
                    </h2>
                    <button onclick="resetSliders()" class="text-xs text-slate-400 hover:text-purple-400 transition underline">重設預設值</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Font Size Slider -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-300">文字大小 (Font Size)</span>
                            <span id="font-size-val" class="text-purple-400 font-bold">32px</span>
                        </div>
                        <input type="range" id="font-size-slider" min="16" max="64" value="32" 
                            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
                    </div>

                    <!-- Text Vertical Position Slider -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-300">邊距縮排 (Padding)</span>
                            <span id="padding-val" class="text-purple-400 font-bold">16px</span>
                        </div>
                        <input type="range" id="padding-slider" min="8" max="48" value="16" 
                            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
                    </div>
                </div>
            </div>

        </div>

        <!-- Right Panel: Live Preview & Download (5 Columns) -->
        <div class="lg:col-span-5 space-y-6 lg:sticky lg:top-24">
            
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl backdrop-blur flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-4">
                    <h2 class="text-sm font-bold tracking-wider text-purple-400 uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-eye text-purple-400"></i>
                        <span>即時預覽畫面</span>
                    </h2>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span>
                        實時生成中
                    </span>
                </div>

                <!-- Meme Canvas Container to Export -->
                <div id="meme-canvas-wrapper" class="relative w-full aspect-square bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner flex items-center justify-center group">
                    <!-- Background Image -->
                    <img id="meme-image" crossorigin="anonymous" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800&auto=format&fit=crop" alt="Meme Base" class="w-full h-full object-cover">
                    
                    <!-- Top Text Overlay -->
                    <div id="preview-top-text" class="meme-text absolute top-4 left-4 right-4 text-center px-2 break-words drop-shadow-md" style="font-size: 32px;">
                        當你以為DDL還很久
                    </div>

                    <!-- Bottom Text Overlay -->
                    <div id="preview-bottom-text" class="meme-text absolute bottom-4 left-4 right-4 text-center px-2 break-words drop-shadow-md" style="font-size: 32px;">
                        結果明天就要交作業
                    </div>

                    <!-- Watermark -->
                    <div class="absolute bottom-1 right-2 text-[9px] text-white/40 font-mono tracking-tighter pointer-events-none">
                        #MemeCraft
                    </div>
                </div>

                <!-- Download & Share Action Button -->
                <button onclick="downloadMeme()" id="download-btn" class="w-full mt-5 bg-gradient-to-r from-purple-600 via-purple-500 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-purple-500/25 transition flex items-center justify-center space-x-2 transform active:scale-[0.98]">
                    <i class="fa-solid fa-download text-lg"></i>
                    <span>一鍵下載迷因圖片 (PNG)</span>
                </button>
                
                <p class="text-[11px] text-slate-500 text-center mt-3">
                    💡 提示：所有操作皆在您的瀏覽器本機完成，圖片與文字絕不上傳伺服器。
                </p>
            </div>

        </div>

    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500 mt-auto">
        <p>MemeCraft Generator &copy; 2026 | 設計給富有幽默感的工程師與創作者</p>
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 border border-purple-500/50 text-slate-100 px-5 py-3 rounded-xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 flex items-center space-x-3">
        <div id="toast-icon" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <div>
            <p id="toast-title" class="text-xs font-bold text-white">操作成功</p>
            <p id="toast-message" class="text-[11px] text-slate-400">迷因圖片已成功下載！</p>
        </div>
    </div>

    <script>
        // Preset meme base images
        const presetImages = [
            { name: "經典柴犬", url: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=800&auto=format&fit=crop" },
            { name: "思考貓咪", url: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=800&auto=format&fit=crop" },
            { name: "程式設計", url: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=800&auto=format&fit=crop" },
            { name: "驚訝倉鼠", url: "https://images.unsplash.com/photo-1425082661705-1834bfd09dca?q=80&w=800&auto=format&fit=crop" },
            { name: "科技未來", url: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop" }
        ];

        // Random funny meme text combinations
        const randomMemes = [
            { top: "當你修好了一個Bug", bottom: "卻發現引發了十個新Bug" },
            { top: "老闆：這個功能很簡單", bottom: "我：明天上線可以嗎？" },
            { top: "以為今天能準時下班", bottom: "客戶：加個需求" },
            { top: "程式碼能正常運行", bottom: "但我完全不知道為什麼" },
            { top: "星期一早上的我", bottom: "靈魂已經先下班了" },
            { top: "資深工程師的日常", bottom: "Ctrl+C 與 Ctrl+V 的藝術" }
        ];

        // DOM Elements
        const imageUpload = document.getElementById('image-upload');
        const memeImage = document.getElementById('meme-image');
        const topTextInput = document.getElementById('top-text-input');
        const bottomTextInput = document.getElementById('bottom-text-input');
        const previewTopText = document.getElementById('preview-top-text');
        const previewBottomText = document.getElementById('preview-bottom-text');
        const topCharCount = document.getElementById('top-char-count');
        const bottomCharCount = document.getElementById('bottom-char-count');
        const fontSizeSlider = document.getElementById('font-size-slider');
        const fontSizeVal = document.getElementById('font-size-val');
        const paddingSlider = document.getElementById('padding-slider');
        const paddingVal = document.getElementById('padding-val');
        const presetContainer = document.getElementById('preset-container');
        const memeCanvasWrapper = document.getElementById('meme-canvas-wrapper');

        // Initialize preset buttons
        function initPresets() {
            presetContainer.innerHTML = '';
            presetImages.forEach((preset) => {
                const btn = document.createElement('button');
                btn.className = "flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border-2 border-slate-700 hover:border-purple-500 focus:outline-none transition group relative";
                btn.innerHTML = `
                    <img src="${preset.url}" alt="${preset.name}" crossorigin="anonymous" class="w-full h-full object-cover group-hover:scale-110 transition duration-300">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-[10px] font-bold text-white px-1 text-center">
                        ${preset.name}
                    </div>
                `;
                btn.onclick = () => {
                    memeImage.src = preset.url;
                    showToast("切換底圖", `已載入 ${preset.name} 底圖`);
                };
                presetContainer.appendChild(btn);
            });
        }

        // Handle File Upload via FileReader
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    memeImage.src = event.target.result;
                    showToast("上傳成功", "已成功讀取您的本機圖片！");
                }
                reader.readAsDataURL(file);
            }
        });

        // Drag and Drop support
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-purple-500', 'bg-purple-950/20');
            }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-purple-500', 'bg-purple-950/20');
            }, false);
        });
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                imageUpload.files = files;
                const event = new Event('change');
                imageUpload.dispatchEvent(event);
            }
        });

        // Real-time Text Update & Character Counter
        topTextInput.addEventListener('input', (e) => {
            const val = e.target.value;
            previewTopText.textContent = val;
            topCharCount.textContent = `${val.length}/50`;
        });

        bottomTextInput.addEventListener('input', (e) => {
            const val = e.target.value;
            previewBottomText.textContent = val;
            bottomCharCount.textContent = `${val.length}/50`;
        });

        // Sliders Control
        fontSizeSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            fontSizeVal.textContent = size;
            previewTopText.style.fontSize = size;
            previewBottomText.style.fontSize = size;
        });

        paddingSlider.addEventListener('input', (e) => {
            const pad = e.target.value + 'px';
            paddingVal.textContent = pad;
            previewTopText.style.top = pad;
            previewTopText.style.left = pad;
            previewTopText.style.right = pad;
            previewBottomText.style.bottom = pad;
            previewBottomText.style.left = pad;
            previewBottomText.style.right = pad;
        });

        // Reset Sliders
        function resetSliders() {
            fontSizeSlider.value = 32;
            fontSizeVal.textContent = "32px";
            previewTopText.style.fontSize = "32px";
            previewBottomText.style.fontSize = "32px";

            paddingSlider.value = 16;
            paddingVal.textContent = "16px";
            previewTopText.style.top = "16px";
            previewTopText.style.left = "16px";
            previewTopText.style.right = "16px";
            previewBottomText.style.bottom = "16px";
            previewBottomText.style.left = "16px";
            previewBottomText.style.right = "16px";
            
            showToast("重設成功", "樣式參數已恢復預設值");
        }

        // Random Meme Generator
        function triggerRandomMeme() {
            const randomItem = randomMemes[Math.floor(Math.random() * randomMemes.length)];
            topTextInput.value = randomItem.top;
            previewTopText.textContent = randomItem.top;
            topCharCount.textContent = `${randomItem.top.length}/50`;

            bottomTextInput.value = randomItem.bottom;
            previewBottomText.textContent = randomItem.bottom;
            bottomCharCount.textContent = `${randomItem.bottom.length}/50`;

            const randomPreset = presetImages[Math.floor(Math.random() * presetImages.length)];
            memeImage.src = randomPreset.url;

            showToast("隨機金句", "已隨機套用迷因金句與底圖！");
        }

        // Download Meme using html2canvas
        function downloadMeme() {
            const btn = document.getElementById('download-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i><span>正在合成迷因...</span>`;
            btn.disabled = true;

            memeImage.crossOrigin = "anonymous";

            html2canvas(memeCanvasWrapper, {
                useCORS: true,
                allowTaint: true,
                scale: 2,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `memecraft-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast("下載成功", "迷因圖片已順利儲存至您的裝置！");
            }).catch(err => {
                console.error(err);
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast("下載失敗", "圖片跨域或渲染發生錯誤，請重新嘗試", true);
            });
        }

        // Toast Notification Helper
        function showToast(title, message, isError = false) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastTitle.textContent = title;
            toastMessage.textContent = message;

            if (isError) {
                toastIcon.className = "w-6 h-6 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs";
                toastIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            } else {
                toastIcon.className = "w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs";
                toastIcon.innerHTML = `<i class="fa-solid fa-check"></i>`;
            }

            toast.classList.remove('translate-y-24', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initPresets();
            topTextInput.value = "當你以為DDL還很久";
            bottomTextInput.value = "結果明天就要交作業";
        });
    </script>
</body>
</html>
